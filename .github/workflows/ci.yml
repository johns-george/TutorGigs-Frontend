name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Blocking checks are typecheck + build. Lint still reports 74 errors
      # (mostly no-explicit-any), so it runs informationally until that debt is cleared.
      - name: Lint
        run: npm run lint
        continue-on-error: true
